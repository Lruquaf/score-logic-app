name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scorelogic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scorelogic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/scorelogic_test
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: true
      DAILY_TIME_ZONE: Europe/Istanbul
      UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder-upstash-token
      RATE_LIMIT_TRUSTED_PROXY_HOPS: 1
      OBSERVABILITY_HASH_SALT: ci-observability-hash-salt-at-least-32-characters
      SENTRY_DSN: https://public@ci.ingest.sentry.io/1
      NEXT_PUBLIC_SENTRY_DSN: https://public@ci.ingest.sentry.io/1
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otel-ci.example.com
      OTEL_TRACES_SAMPLER_ARG: 0.1
      POSTHOG_API_KEY: phc_ci_placeholder_key
      POSTHOG_HOST: https://eu.i.posthog.com
      SYNTHETIC_MONITOR_TOKEN: ci-synthetic-monitor-token-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Validate observability operations
        run: npm run ops:validate

      - name: Unit tests
        run: npm run test:unit

      - name: Engine performance budget
        run: npm run perf:check

      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        env:
          # Build validation requires HTTPS; browser E2E still uses its local HTTP origin.
          AUTH_URL: https://ci.scorelogic.example
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scorelogic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scorelogic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/scorelogic_test
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: true
      DAILY_TIME_ZONE: Europe/Istanbul
      E2E_PORT: 3100
      UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder-upstash-token
      RATE_LIMIT_TRUSTED_PROXY_HOPS: 1
      OBSERVABILITY_HASH_SALT: ci-observability-hash-salt-at-least-32-characters
      SENTRY_DSN: https://public@ci.ingest.sentry.io/1
      NEXT_PUBLIC_SENTRY_DSN: https://public@ci.ingest.sentry.io/1
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otel-ci.example.com
      OTEL_TRACES_SAMPLER_ARG: 0.1
      POSTHOG_API_KEY: phc_ci_placeholder_key
      POSTHOG_HOST: https://eu.i.posthog.com
      SYNTHETIC_MONITOR_TOKEN: ci-synthetic-monitor-token-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test database
        run: npm run db:setup

      - name: Audit published puzzle content
        run: npm run db:audit-content

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run bounded application load test
        env:
          LOAD_TEST_DURATION_SECONDS: 10
          LOAD_TEST_CONCURRENCY: 8
        run: npm run perf:load:local

  mobile-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install prototype browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Mobile UX prototype acceptance
        run: npm run test:mobile:prototype

      - name: Upload prototype failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ux-failure-traces
          path: test-results/
          retention-days: 7

  native-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_API_URL: https://score-logic-app-test.up.railway.app
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install isolated native dependencies
        run: npm ci

      - name: Audit native production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check native client
        run: npm run type-check

      - name: Native durability tests
        run: npm test

      - name: Native component and navigation flows
        run: npm run test:components

      - name: Native source contrast budgets
        run: npm run check:a11y

      - name: Expo dependency checks
        run: npx expo install --check

      - name: Export iOS and Android JavaScript
        env:
          AUTH_SECRET: SCORELOGIC_SERVER_ONLY_CANARY_CI_AUTH
          DATABASE_URL: SCORELOGIC_SERVER_ONLY_CANARY_CI_DATABASE
          SENTRY_AUTH_TOKEN: SCORELOGIC_SERVER_ONLY_CANARY_CI_UPLOAD
        run: npm run export:native:maps

      - name: Verify native Debug IDs and private-source boundary
        run: npm run check:export
